# One project/environment serves conversion, shared contracts, and future analysis.
[project]
name = "nasdaq-book-reconstruction"
version = "0.1.0"
description = "Strict, documented Nasdaq ITCH 5.0 to Parquet conversion"
requires-python = ">=3.10"
dependencies = ["pyarrow>=18,<24"]

[project.scripts]
# uv run itch-convert invokes this function inside the project environment.
itch-convert = "book_reconstruction.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
# Notebook tools are optional: converter-only users do not need to install them.
analysis = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.15.0",
    "scipy>=1.15.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The on-disk hyphenated directory contains an importable underscore package.
packages = ["common", "book_reconstruction", "analysis"]
package-dir = { common = "common", book_reconstruction = "book-reconstruction/book_reconstruction", analysis = "analysis" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["common", "book-reconstruction/book_reconstruction", "analysis"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
