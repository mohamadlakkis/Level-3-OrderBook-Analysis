# One project/environment serves conversion, shared contracts, and future analysis.
[project]
name = "nasdaq-book-reconstruction"
version = "0.1.0"
description = "Strict, documented Nasdaq ITCH 5.0 to Parquet conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyarrow>=18,<24"]

[project.scripts]
# uv run itch-convert invokes this function inside the project environment.
itch-convert = "book_reconstruction.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The on-disk hyphenated directory contains an importable underscore package.
packages = ["common", "book_reconstruction"]
package-dir = { common = "common", book_reconstruction = "book-reconstruction/book_reconstruction" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["common", "book-reconstruction/book_reconstruction"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
